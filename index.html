<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QALQAN — Cybersecurity Simulator</title><meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--b2:#0a0a0a;--cd:#111;--bd:#292929;--tx:#fff;--m:#a0a0a0;--d:#555;--e:cubic-bezier(.2,.7,.2,1);--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{background:#000;color:var(--tx);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:auto}
#hud{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--b2);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#hud h1{font-size:15px;font-weight:700;letter-spacing:.22em;display:flex;align-items:center;gap:10px;margin-right:auto;flex-wrap:wrap}
.beta{font:600 9px/1 Inter,system-ui,sans-serif;letter-spacing:.18em;border:1px solid #fff;background:#000;padding:3px 6px;border-radius:3px;animation:bl 3.2s ease-in-out infinite}
@keyframes bl{50%{opacity:.5}}
.ver,.ch{font-size:10px;font-weight:400;letter-spacing:.14em;color:var(--d)}.ch{color:var(--m)}
.st b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}.st span{font-size:11px;color:var(--m)}
.bar{height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:#fff;transition:width .8s var(--e)}
.shell{display:grid;grid-template-columns:180px 1fr;gap:14px;margin-top:14px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:14px}
nav button{border:0;border-left:2px solid transparent;background:transparent;color:var(--m);border-radius:0 6px 6px 0}
nav button:hover:not(:disabled){background:var(--cd);color:#fff}
nav button.on{background:var(--cd);color:#fff;border-left-color:#fff}
@media(max-width:850px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;position:static}nav button{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}nav button.on{border-bottom-color:#fff}}
button{font:inherit;font-size:13px;color:#fff;background:#000;border:1px solid #fff;border-radius:5px;padding:7px 13px;cursor:pointer;text-align:left;transition:background .18s,color .18s,border-color .18s,transform .12s}
button:hover:not(:disabled){background:#fff;color:#000}button:active:not(:disabled){transform:scale(.98)}
button:disabled{color:var(--d);border-color:var(--bd);cursor:not-allowed}button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pr{background:#fff;color:#000;font-weight:600}.pr:hover:not(:disabled){background:#000;color:#fff}.pr:disabled{background:#111;color:var(--d)}
.tabs button.on,.row button.on{background:#fff;color:#000}
.grid2{display:grid;grid-template-columns:1fr 1.7fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
@media(max-width:850px){.grid2{grid-template-columns:1fr}}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.box h2{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.card{background:var(--b2);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--d);transform:translateY(-1px)}.card.sel{border-color:#fff}
.card h3{font-size:13px;font-weight:600}.card p,.m{font-size:12px;color:var(--m);margin:4px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bd{font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:3px;border:1px solid}
.d0{color:var(--m);border-color:var(--d)}.d1{color:#fff;border-color:#fff}.d2{background:#fff;color:#000;border-color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ev{padding:8px 11px;border:1px solid var(--bd);border-left:2px solid var(--d);border-radius:4px;margin-bottom:6px;background:#000;color:var(--m);cursor:pointer;font-size:12.5px;transition:.15s}
.ev:hover{border-color:var(--d);color:#fff}.ev.mk{border-left:2px solid #fff;background:#1a1a1a;color:#fff}
.op{display:block;width:100%;margin-bottom:8px}
.g,.cy{color:#fff;font-weight:600}.rd{color:var(--m)}
.pb{height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:#fff;transition:width .6s var(--e)}
.av{border-radius:8px;flex:none}.who{display:flex;gap:12px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:14px;z-index:20;overflow:auto}.ov.on{display:flex;animation:fi .25s}
.modal{background:var(--b2);border:1px solid var(--bd);border-radius:10px;max-width:620px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.9);animation:su .35s var(--e)}
.modal h3{font-size:16px;margin-bottom:10px}.modal p{margin-bottom:10px}
.note{background:#000;border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin:12px 0;font-size:13px}.note p{margin-bottom:6px;color:var(--m)}.note b{color:#fff}
@keyframes fi{from{opacity:0}}@keyframes su{from{opacity:0;transform:translateY(14px)}}
main.pt{animation:su .35s var(--e)}
#toasts{position:fixed;top:12px;right:12px;z-index:90;display:flex;flex-direction:column;gap:6px;max-width:300px}
.ts{background:#fff;color:#000;border-radius:6px;padding:9px 13px;font-size:13px;animation:su .3s var(--e),fo .4s 3.4s forwards}
@keyframes fo{to{opacity:0;transform:translateY(-6px)}}
.fl{position:fixed;left:50%;top:100px;font-size:24px;font-weight:700;z-index:95;pointer-events:none;transform:translateX(-50%);animation:up 1.6s forwards}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.tr{background:#000;z-index:30}.tr .in{text-align:center;max-width:560px;animation:su .9s var(--e)}.tr h1{font-size:34px;letter-spacing:.2em;margin-bottom:14px}.tr p{margin-bottom:16px;color:var(--m)}
#chat{position:fixed;right:14px;bottom:14px;width:320px;max-width:calc(100% - 28px);background:var(--b2);border:1px solid var(--bd);border-radius:10px;z-index:15;box-shadow:0 16px 50px rgba(0,0,0,.9);animation:su .3s var(--e)}
#chat.hide{display:none}#cl{height:200px;overflow-y:auto;padding:10px;font:12px/1.5 var(--mono);color:var(--m)}#cl div{margin-bottom:8px}#cl b{color:#fff}
#cin{width:100%;background:#000;border:1px solid var(--bd);color:#fff;padding:8px;font:inherit;font-size:13px;border-radius:5px}#cin:focus{outline:none;border-color:#fff}
.chart{width:100%;background:#000;border:1px solid var(--bd);border-radius:6px}
.pip{display:inline-block;width:14px;height:5px;border:1px solid var(--d);margin-right:3px;border-radius:1px}.pip.f{background:#fff;border-color:#fff}
textarea{width:100%;height:80px;background:#000;color:#fff;border:1px solid var(--bd);border-radius:5px;font:12px var(--mono);margin:6px 0}
input[type=file]{color:var(--m);font-size:12px}
footer{text-align:center;color:var(--d);font-size:10px;letter-spacing:.2em;padding:26px 0 70px;border-top:1px solid var(--bd);margin-top:20px}
#intro{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;transition:opacity .7s var(--e)}
#intro.on{display:flex}#intro.out{opacity:0;pointer-events:none}
#intro .lg{font-size:clamp(38px,11vw,88px);font-weight:800;letter-spacing:.3em;margin-right:-.3em;animation:li 1.6s var(--e) both}
@keyframes li{from{opacity:0;filter:blur(8px);letter-spacing:.6em}}
#intro .sub{font:12px var(--mono);letter-spacing:.3em;color:var(--m);min-height:18px}
.cur{display:inline-block;width:7px;height:12px;background:#fff;margin-left:4px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.35;animation:sc 3.2s linear infinite}
@keyframes sc{from{top:-2%}to{top:102%}}
.ldw{width:min(340px,72vw)}.ld{height:1px;background:var(--bd)}.ld i{display:block;height:100%;width:0;background:#fff}
.meta{display:flex;justify-content:space-between;font:10px var(--mono);letter-spacing:.2em;color:var(--d);margin-top:8px}
#intro .ver2{font:10px var(--mono);letter-spacing:.25em;color:var(--m)}
#intro .intro-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}#istart,#itrailer{opacity:0;pointer-events:none;transition:opacity .7s,background .18s,color .18s;letter-spacing:.2em;text-align:center;min-width:170px}#istart.show,#itrailer.show{opacity:1;pointer-events:auto}#itrailer{background:#080808;color:#fff;border-color:#666}#itrailer:hover{background:#fff;color:#000}@media(max-width:480px){#intro .intro-actions{width:100%;max-width:330px;display:grid;grid-template-columns:1fr}#istart,#itrailer{width:100%}}
.skip{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:.18em;border-color:var(--bd);color:var(--m)}
.sig{position:absolute;bottom:20px;font-size:10px;letter-spacing:.25em;color:var(--d);line-height:1.8}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* ==========================================================
   QALQAN SMART DISPLAY SYSTEM — adaptive device workspaces
   All breakpoints use CSS viewport dimensions, never physical
   pixel resolution. The active mode is selected by JS.
   ========================================================== */
:root{
 --safe-top:env(safe-area-inset-top,0px);
 --safe-right:env(safe-area-inset-right,0px);
 --safe-bottom:env(safe-area-inset-bottom,0px);
 --safe-left:env(safe-area-inset-left,0px);
 --ui-gap:clamp(8px,1vw,16px);
 --ui-pad:clamp(10px,1.2vw,18px);
 --ui-font:clamp(12px,0.82vw,14px);
 color-scheme:dark;
}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{font-size:var(--ui-font);min-height:100vh;min-height:100dvh;padding:max(8px,var(--safe-top)) max(8px,var(--safe-right)) max(8px,var(--safe-bottom)) max(8px,var(--safe-left))}
.wrap{width:100%;max-width:1200px;min-width:0}
#hud,#nav,#main,.shell,.box,.card,.row,.grid2,.g3{min-width:0}
#main{min-width:0}
button,input,select,textarea{max-width:100%;font:inherit}
button{white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}
.card h3,.card p,.box p,.note,.ev,.modal,.st span{overflow-wrap:anywhere;word-break:break-word}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.chart{display:block;max-width:100%}
.ov{padding:max(10px,var(--safe-top)) max(10px,var(--safe-right)) max(10px,var(--safe-bottom)) max(10px,var(--safe-left));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal{max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 32px);overflow-y:auto;overscroll-behavior:contain}
#intro{min-height:100vh;min-height:100dvh;padding:calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));overflow:hidden}
#intro .lg{max-width:100%;font-size:clamp(36px,7vw,88px);letter-spacing:clamp(.12em,.3em, .3em);margin-right:-.2em;overflow-wrap:normal}
#intro .sub{max-width:100%;font-size:clamp(10px,1vw,12px);letter-spacing:clamp(.08em,.3em,.3em);overflow-wrap:anywhere}
#intro .sig{max-width:calc(100% - 32px)}
#chat{max-height:min(70dvh,480px);max-width:calc(100vw - 28px);overflow:hidden}
#cl{overscroll-behavior:contain}

/* MOBILE: dedicated stacked workspace + bottom navigation */
html[data-ui-mode="mobile"] body{padding:0 0 calc(76px + var(--safe-bottom));min-height:100vh;min-height:100dvh}
html[data-ui-mode="mobile"] .wrap{max-width:none;width:100%;padding-bottom:0}
html[data-ui-mode="mobile"] #hud{
 position:sticky;top:0;z-index:12;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 9px;
 padding:calc(9px + var(--safe-top)) 11px 10px;background:rgba(8,8,8,.97);border:0;border-bottom:1px solid var(--bd);border-radius:0;box-shadow:0 7px 20px rgba(0,0,0,.72);backdrop-filter:blur(12px)
}
html[data-ui-mode="mobile"] #hud h1{grid-column:1/-1;margin:0;font-size:13px;letter-spacing:.12em;gap:7px}
html[data-ui-mode="mobile"] #hud .ver{display:none}
html[data-ui-mode="mobile"] #hud .ch{font-size:9px}
html[data-ui-mode="mobile"] #hud .st{min-width:0}
html[data-ui-mode="mobile"] #hud .st b{font-size:clamp(13px,4vw,17px);line-height:1.25;overflow-wrap:anywhere}
html[data-ui-mode="mobile"] #hud .st span{font-size:10px}
html[data-ui-mode="mobile"] #hud .bar{grid-column:1/-1;width:100%;min-width:0}
html[data-ui-mode="mobile"] #hud button{min-height:42px;padding:8px 9px;text-align:center;font-size:11px}
html[data-ui-mode="mobile"] .shell{display:block;margin:8px 0 0;padding:0 10px}
html[data-ui-mode="mobile"] #nav{
 position:fixed;left:0;right:0;top:auto;bottom:0;z-index:42;display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:stretch;align-items:center;gap:3px;height:calc(64px + var(--safe-bottom));min-height:64px;max-height:80px;
 padding:6px max(6px,var(--safe-right)) calc(6px + var(--safe-bottom)) max(6px,var(--safe-left));
 background:rgba(5,5,5,.97);border:0;border-top:1px solid #383838;border-radius:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;backdrop-filter:blur(14px);scrollbar-width:none
}
html[data-ui-mode="mobile"] #nav::-webkit-scrollbar{display:none}
html[data-ui-mode="mobile"] #nav button{flex:1 1 0;min-width:0;max-width:none;height:51px;min-height:51px;max-height:51px;padding:6px 3px;border:1px solid transparent;border-bottom:2px solid transparent;border-radius:7px;text-align:center;font-size:clamp(9px,2.65vw,11px);line-height:1.1;letter-spacing:0;overflow-wrap:anywhere}
html[data-ui-mode="mobile"] #nav button.on{background:#181818;color:#fff;border-color:#383838;border-bottom-color:#fff}
html[data-ui-mode="mobile"] #main{padding:0 0 10px;overflow:visible}
html[data-ui-mode="mobile"] .grid2,html[data-ui-mode="mobile"] .g3{grid-template-columns:minmax(0,1fr);gap:9px}
html[data-ui-mode="mobile"] .box{padding:13px;margin-bottom:10px;border-radius:8px}
html[data-ui-mode="mobile"] .box h2{font-size:10px;letter-spacing:.1em}
html[data-ui-mode="mobile"] .card{padding:11px;margin-bottom:8px}
html[data-ui-mode="mobile"] .row{align-items:flex-start}
html[data-ui-mode="mobile"] .row>button{flex:1 1 auto;min-width:0}
html[data-ui-mode="mobile"] button{min-height:44px;padding:10px 11px;font-size:13px}
html[data-ui-mode="mobile"] .ev{min-height:44px;display:flex;align-items:center;padding:10px 12px;font-size:13px;line-height:1.4;user-select:none;-webkit-user-select:none}
html[data-ui-mode="mobile"] .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;overscroll-behavior-x:contain}
html[data-ui-mode="mobile"] .tabs button{flex:0 0 auto;min-height:42px;white-space:nowrap}
html[data-ui-mode="mobile"] .modal{width:100%;max-width:none;padding:17px 15px;border-radius:12px}
html[data-ui-mode="mobile"] .ov{align-items:flex-start;padding-top:max(10px,var(--safe-top));padding-bottom:max(10px,var(--safe-bottom))}
html[data-ui-mode="mobile"] #chat{left:8px;right:8px;bottom:calc(68px + var(--safe-bottom));width:auto;max-width:none;max-height:55dvh;border-radius:12px}
html[data-ui-mode="mobile"] #cl{height:clamp(112px,24dvh,180px)}
html[data-ui-mode="mobile"] footer{display:none}
html[data-ui-mode="mobile"] #intro .lg{font-size:clamp(34px,12vw,62px);letter-spacing:.14em;margin-right:-.14em}
html[data-ui-mode="mobile"] #intro .sub{font-size:10px;letter-spacing:.11em}
html[data-ui-mode="mobile"] #intro .sig{font-size:9px;bottom:calc(10px + var(--safe-bottom));letter-spacing:.12em}
html[data-ui-mode="mobile"] .scan{animation-duration:5s}
html[data-ui-mode="mobile"] .card:hover{transform:none}
html[data-ui-mode="mobile"] .soc-mobile-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}
html[data-ui-mode="mobile"] .soc-mobile-switch button{min-height:45px;text-align:center;font-size:11px;padding:8px 5px}
html[data-ui-mode="mobile"] .soc-mobile-switch button.active{background:#fff;color:#000;font-weight:700}
html[data-ui-mode="mobile"] .soc-return{width:100%;margin-bottom:9px}
html[data-ui-mode="mobile"] .team-table-wrap{display:none}
html[data-ui-mode="mobile"] .team-cards{display:block}
html[data-ui-mode="mobile"] .ov{z-index:60}

/* TABLET: touch-sized controls; sidebar in landscape, top rail in portrait */
html[data-ui-mode="tablet"] body{padding:12px;min-height:100dvh}
html[data-ui-mode="tablet"] .wrap{max-width:1500px}
html[data-ui-mode="tablet"] #hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:12px}
html[data-ui-mode="tablet"] #hud h1{grid-column:1/-1;margin:0;font-size:14px}
html[data-ui-mode="tablet"] #hud .st b{font-size:15px}
html[data-ui-mode="tablet"] .shell{display:grid;grid-template-columns:126px minmax(0,1fr);gap:10px;margin-top:10px}
html[data-ui-mode="tablet"] #nav{position:sticky;top:10px;display:flex;flex-direction:column;overflow:visible;gap:4px}
html[data-ui-mode="tablet"] #nav button{min-height:44px;padding:9px 8px;font-size:11px;text-align:left;white-space:normal}
html[data-ui-mode="tablet"] #main{min-width:0}
html[data-ui-mode="tablet"] .grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html[data-ui-mode="tablet"] .g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html[data-ui-mode="tablet"] .box{padding:13px}
html[data-ui-mode="tablet"] button{min-height:44px}
html[data-ui-mode="tablet"] .team-table-wrap{display:none}
html[data-ui-mode="tablet"] .team-cards{display:block}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] .shell{display:flex;flex-direction:column;gap:8px}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] #nav{position:static;width:100%;max-width:100%;align-self:stretch;flex:0 0 auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding-bottom:5px}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] #nav button{flex:0 0 auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] #nav button.on{border-bottom-color:#fff}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-ui-mode="tablet"][data-ui-orientation="portrait"] .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-ui-mode="tablet"] #chat{bottom:12px;right:12px}

/* LAPTOP: compact professional workspace; inner work area scrolls */
html[data-ui-mode="laptop"] body{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:9px}
html[data-ui-mode="laptop"] .wrap{height:100%;max-width:none;display:flex;flex-direction:column;overflow:hidden}
html[data-ui-mode="laptop"] #hud{flex:0 0 auto;gap:7px 13px;padding:9px 12px}
html[data-ui-mode="laptop"] #hud h1{font-size:14px;letter-spacing:.16em}
html[data-ui-mode="laptop"] #hud .st b{font-size:15px}
html[data-ui-mode="laptop"] .shell{display:grid;grid-template-columns:148px minmax(0,1fr);flex:1 1 auto;min-height:0;gap:10px;margin-top:9px;overflow:hidden}
html[data-ui-mode="laptop"] #nav{position:sticky;top:0;align-self:start;gap:2px}
html[data-ui-mode="laptop"] #nav button{padding:7px 9px;font-size:12px}
html[data-ui-mode="laptop"] #main{height:100%;max-height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px;overscroll-behavior:contain;scrollbar-gutter:stable}
html[data-ui-mode="laptop"] .grid2{grid-template-columns:minmax(240px,.9fr) minmax(0,1.2fr);gap:10px}
html[data-ui-mode="laptop"] .g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
html[data-ui-mode="laptop"] .box{padding:13px;margin-bottom:10px}
html[data-ui-mode="laptop"] .card{padding:10px;margin-bottom:8px}

 const staffRows=S.staff.map((e,i)=>`<tr><td><b>${e.n}</b><br><span class="m">${SP[e.sp][0]}</span></td><td>${stars(e)}<br>ур. ${e.lv}</td><td>${fm(sal(e))}/мес</td><td>Опыт ${e.expPoints||e.exp||0}/${4*e.lv}<br>Усталость ${e.fa}% · настроение ${e.jo}%</td><td>${e.pr?"На проекте":e.busy?"Недоступен "+e.busy+" дн.":"Свободен"}</td><td>${actionButtons(e,i)}</td></tr>`).join("");

}

function initSmartDisplay(){
 applyDisplayMode(false);DISPLAY.socPanel=S.cur?"detail":"queue";DISPLAY.ready=true;
 const schedule=()=>{if(DISPLAY.raf)return;DISPLAY.raf=requestAnimationFrame(()=>{DISPLAY.raf=0;applyDisplayMode(true)})};
 window.addEventListener("resize",schedule,{passive:true});
 window.addEventListener("orientationchange",()=>setTimeout(schedule,80),{passive:true});
 if(window.visualViewport)window.visualViewport.addEventListener("resize",schedule,{passive:true});
 if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",schedule);
 ["(pointer:coarse)","(pointer:fine)","(hover:hover)","(orientation:portrait)"].forEach(q=>{try{const m=matchMedia(q);m.addEventListener?m.addEventListener("change",schedule):m.addListener&&m.addListener(schedule)}catch(e){}});
 if("ResizeObserver" in window){
  DISPLAY.observer=new ResizeObserver(()=>schedule());
  const target=$("wrap")||document.querySelector(".wrap");if(target)DISPLAY.observer.observe(target);
 }
 document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
   if($("ov").classList.contains("on"))closeM();
   else if($("tr").classList.contains("on"))$("tr").classList.remove("on");
   else if(!$("chat").classList.contains("hide"))$("chat").classList.add("hide");
  }
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^[1-7]$/.test(e.key)&&!$("cin")?.matches(":focus")&&!$("imp")?.matches(":focus")){
   const list=S.ch===2?["dash","team","ctr","off","skills","ach","con"]:["work","skills","ach","con"];
   const idx=Number(e.key)-1;if(list[idx]){e.preventDefault();view=list[idx];render()}
  }
 });
}
